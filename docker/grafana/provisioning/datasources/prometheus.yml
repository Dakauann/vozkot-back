apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # The compose service name. On a host-network deployment this is
    # http://localhost:9090 instead.
    url: http://prometheus:9090
    isDefault: true
    # Provisioned from the repository, so the dashboards are reviewable and a
    # rebuild restores them. Editing in the UI would be lost on the next deploy.
    editable: false
    jsonData:
      timeInterval: "5s"
