apiVersion: 1

providers:
  - name: Vozkot
    orgId: 1
    folder: ""
    type: file
    disableProvisioning: false
    # Editable in the UI for exploring, but the file on disk is the source of
    # truth and wins on restart.
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
