        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 42
        type: integer
    type: object
  ticket.TicketResponse:
    properties:
      available:
        example: 360
        type: integer
      createdAt:
        type: string
      currency:
        example: BRL
        type: string
      description:
        type: string
      eventId:
        example: evt_a1b2c3d4
        type: string
      id:
        example: tkt_a1b2c3d4
        type: string
      media:
        items:
          $ref: '#/definitions/ticket.MediaResponse'
        type: array
      priceCents:
        example: 24000
        type: integer
      quantity:
        example: 500
        type: integer
      reserved:
        description: |-
          Reserved is stock held by orders waiting to be paid. An operator looking
          at a tier that is nearly gone needs to know whether it went to sales or
          to holds, because those two have completely different answers.
        example: 12
        type: integer
      sold:
        example: 128
        type: integer
      status:
        enum:
        - draft
        - on_sale
        - sold_out
        - cancelled
        example: on_sale
        type: string
      title:
        example: Pista Premium
        type: string
      updatedAt:
        type: string
    type: object
  ticket.UpdateRequest:
    properties:
      description:
        example: Acesso à área premium com bar exclusivo.
        type: string
      priceCents:
        example: 24000
        type: integer
      quantity:
        example: 500
        type: integer
      status:
        enum:
        - draft
        - on_sale
        - sold_out
        - cancelled
        example: on_sale
        type: string
      title:
        example: Pista Premium
        type: string
    type: object
info:
  contact: {}
  description: API base para autenticação e gestão de tickets, organizada com Clean
    Architecture.
  title: Vozkot Tickets API
  version: "1.0"
paths:
  /api/v1/checkout:
    post:
      consumes:
      - application/json
      description: 'Reserva os ingressos e abre um pedido aguardando pagamento. A
        reserva é imediata; a cobrança PIX é criada por um job e aparece em `payment`
        poucos instantes depois, então o cliente deve consultar o pedido até `payment.pixCopyPaste`
        ser preenchido. O cabeçalho Idempotency-Key é obrigatório: repetir a mesma
        requisição com a mesma chave devolve o mesmo pedido, sem reservar de novo.'
      parameters:
      - description: Chave de idempotência do cliente (UUID)
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Dados da compra
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/checkout.CheckoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/checkout.OrderEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "409":
          description: Chave reutilizada, requisição em andamento ou ingressos esgotados
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Comprar ingressos
      tags:
      - Compras
  /api/v1/events:
    get:
      description: Lista os eventos do operador autenticado, incluindo rascunhos.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.ListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/event.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar meus eventos
      tags:
      - Eventos
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do evento
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/event.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/event.EventEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/event.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/event.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar um evento
      tags:
      - Eventos
  /api/v1/events/{id}:
    delete:
      description: Recusa com 409 se o evento ainda tiver lotes de ingressos, porque
        esses lotes podem ter pedidos e os pedidos são o registro do dinheiro que
        mudou de mãos.
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Removido
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/event.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Excluir um evento
      tags:
      - Eventos
    get:
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.EventEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/event.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar um evento
      tags:
      - Eventos
    put:
      consumes:
      - application/json
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Dados do evento
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/event.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.EventEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/event.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/event.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/event.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar um evento
      tags:
      - Eventos
  /api/v1/events/{id}/attendees:
    get:
      description: 'A lista de participantes, uma linha por lote de cada pedido. Traz
        nome, e-mail, o documento MASCARADO, e o que o comprador informou de sexo,
        idade, cidade e estado. O documento completo, a data de nascimento e o telefone
        nunca são devolvidos: o organizador precisa conferir quem chega na porta,
        não se passar por ela. Por padrão lista apenas pedidos pagos; use `status=all`
        para incluir os estornados.'
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Filtrar por lote
        in: query
        name: ticketId
        type: string
      - description: 'Situação do pedido (padrão: paid)'
        enum:
        - paid
        - refunded
        - all
        in: query
        name: status
        type: string
      - description: Buscar por nome ou e-mail
        in: query
        name: q
        type: string
      - description: Itens por página (padrão 50, máximo 200)
        in: query
        name: limit
        type: integer
      - description: Deslocamento da paginação
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/report.AttendeeListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/report.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/report.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/report.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar quem comprou
      tags:
      - Relatórios
  /api/v1/events/{id}/attendees.csv:
    get:
      description: Baixa a lista de participantes como uma planilha. Aceita os mesmos
        filtros da listagem. O arquivo é UTF-8 com BOM e separado por ponto e vírgula,
        que é o que o Excel em português abre corretamente sem nenhum passo de importação;
        os valores vão em reais com vírgula decimal. As linhas são transmitidas em
        lotes conforme são lidas, então exportar um estádio inteiro não carrega tudo
        na memória.
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Filtrar por lote
        in: query
        name: ticketId
        type: string
      - description: 'Situação do pedido (padrão: paid)'
        enum:
        - paid
        - refunded
        - all
        in: query
        name: status
        type: string
      - description: Buscar por nome ou e-mail
        in: query
        name: q
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/report.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/report.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/report.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Exportar quem comprou (CSV)
      tags:
      - Relatórios
  /api/v1/events/{id}/door:
    get:
      description: Quantos ingressos do evento já entraram e quantos ainda faltam.
        É o número que a tela da portaria mostra. Restrito ao organizador do evento
        e a administradores.
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admission.DoorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Contadores da entrada
      tags:
      - Entrada
  /api/v1/events/{id}/media:
    post:
      consumes:
      - multipart/form-data
      description: Anexa uma imagem ou vídeo ao evento, um arquivo por requisição.
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Arquivo
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/event.MediaResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/event.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/event.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Enviar mídia do evento
      tags:
      - Eventos
  /api/v1/events/{id}/media/{mediaId}:
    delete:
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: ID da mídia
        in: path
        name: mediaId
        required: true
        type: string
      responses:
        "204":
          description: Removido
      security:
      - BearerAuth: []
      summary: Remover mídia do evento
      tags:
      - Eventos
  /api/v1/events/{id}/pin:
    post:
      consumes:
      - application/json
      description: 'Grava as coordenadas escolhidas por uma pessoa. Elas valem mais
        que qualquer geocodificação: uma edição posterior no endereço não as sobrescreve.'
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Coordenadas
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/event.PinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.EventEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/event.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Posicionar o pino no mapa
      tags:
      - Eventos
  /api/v1/events/{id}/publish:
    post:
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.EventEnvelope'
      security:
      - BearerAuth: []
      summary: Publicar um evento
      tags:
      - Eventos
  /api/v1/events/{id}/report:
    get:
      description: 'Os números do evento para o organizador: totais, e a divisão por
        sexo, faixa etária, estado, cidade, lote e dia. Ninguém é identificado aqui
        — são contagens sobre os dados que o comprador informou no cadastro, congelados
        no momento da compra. Todo valor aqui é `netCents`: o que o organizador recebe,
        ou seja, o valor de face que ele definiu. A taxa de serviço da plataforma
        e o total pago pelo comprador não são retornados neste relatório. Restrito
        ao organizador do evento e a administradores.'
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/report.SalesEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/report.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/report.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/report.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Relatório de vendas do evento
      tags:
      - Relatórios
  /api/v1/events/{id}/scan:
    post:
      consumes:
      - application/json
      description: 'Lê um código de ingresso, por QR ou digitado, e o consome se for
        válido. Cada código vale uma única entrada: a segunda leitura responde `already_admitted`
        e informa quando a primeira ocorreu. Um código de outro evento responde `wrong_event`,
        e um de pedido estornado responde `void`. Restrito ao organizador do evento
        e a administradores.'
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Código lido
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admission.ScanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admission.ScanEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Validar um ingresso na entrada
      tags:
      - Entrada
  /api/v1/events/{id}/seating:
    post:
      consumes:
      - application/json
      description: 'Materializa os assentos de um evento a partir de uma planta publicada,
        com um lote por setor. Recusado se o evento já tem mapa: um segundo cria cadeiras
        duplicadas ou divergentes, e os dois são piores do que exigir que o operador
        diga qual queria.'
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Planta e preços
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/seating.BindRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/seating.SeatingEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "409":
          description: O evento já tem mapa de assentos
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Colocar planta à venda
      tags:
      - Assentos
  /api/v1/events/{id}/seating/areas:
    put:
      consumes:
      - application/json
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      - description: Area ticket bindings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/seating.AreaTicketsRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Configure individual admission for each standing area or box
      tags:
      - Assentos
  /api/v1/events/{id}/seating/availability:
    get:
      description: Quantos assentos de cada lote estão livres, que é o número mostrado
        acima de cada setor na escolha.
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/seating.AvailabilityEnvelope'
      summary: Disponibilidade por setor
      tags:
      - Assentos
  /api/v1/events/{id}/seating/best:
    get:
      description: 'Escolhe a melhor sequência de assentos vizinhos que couber no
        pedido. É o caminho principal e não um atalho: a maioria não quer estudar
        um mapa, quer quatro lugares juntos, perto da frente, agora — e é também o
        que dá a quem usa leitor de tela uma forma real de comprar. Devolve vazio
        em vez de separar o grupo em fileiras diferentes.'
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Restringir a um lote
        in: query
        name: ticketId
        type: string
      - description: Quantos assentos
        in: query
        name: quantity
        required: true
        type: integer
      - description: Pedir assentos acessíveis
        in: query
        name: accessible
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/seating.MapEnvelope'
      summary: Melhor disponível
      tags:
      - Assentos
  /api/v1/events/{id}/seating/map:
    get:
      description: 'Os assentos de um evento e a situação de cada um. Com `since`,
        devolve apenas o que mudou desde aquele cursor, que é o que torna barato consultar
        durante uma venda movimentada. Público: um mapa é o que alguém olha antes
        de ter conta.'
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Cursor devolvido na consulta anterior
        in: query
        name: since
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/seating.MapEnvelope'
      summary: Mapa de assentos
      tags:
      - Assentos
  /api/v1/events/{id}/seats/block:
    post:
      consumes:
      - application/json
      description: 'Retira assentos da venda: cadeira quebrada, lugar da produção,
        visão obstruída. Nunca toca um assento reservado ou vendido — bloquear não
        cancela o ingresso de ninguém.'
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Assentos
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/seating.BlockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/seating.BlockResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Bloquear assentos
      tags:
      - Assentos
  /api/v1/events/{id}/seats/unblock:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      - description: Assentos
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/seating.BlockRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/seating.BlockResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Desbloquear assentos
      tags:
      - Assentos
  /api/v1/events/{id}/unpublish:
    post:
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.EventEnvelope'
      security:
      - BearerAuth: []
      summary: Despublicar um evento
      tags:
      - Eventos
  /api/v1/layouts/{id}:
    get:
      description: A planta com seus setores e assentos, para o editor desenhar.
      parameters:
      - description: ID da planta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/seating.LayoutDetailEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Planta completa
      tags:
      - Assentos
  /api/v1/layouts/{id}/compliance:
    get:
      description: 'Quantos espaços para cadeira de rodas, assentos de mobilidade
        reduzida e assentos para obesos a planta deve ter pelo Decreto 5.296/2004
        (art. 23, com a redação do Decreto 9.404/2018), e quantos ela tem. É um relatório,
        não um bloqueio: a plataforma não sabe se uma sala específica é legalmente
        casa de espetáculo, e a responsabilidade é do organizador — que precisa ver
        o número.'
      parameters:
      - description: ID da planta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/seating.ComplianceResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Acessibilidade da planta
      tags:
      - Assentos
  /api/v1/layouts/{id}/preview:
    post:
      consumes:
      - application/json
      description: 'Gera os assentos de um formulário e NÃO grava nada. É o que o
        editor desenha enquanto o organizador digita, e usa o mesmo gerador que a
        gravação vai usar — uma prévia construída por outro caminho é uma prévia que
        pode mentir. Funciona também em planta congelada: olhar não é editar.'
      parameters:
      - description: ID da planta
        in: path
        name: id
        required: true
        type: string
      - description: Setores
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/seating.GenerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/seating.LayoutDetailEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Prévia da planta
      tags:
      - Assentos
  /api/v1/layouts/{id}/publish:
    post:
      description: Torna a planta vinculável a um evento.
      parameters:
      - description: ID da planta
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Publicar planta
      tags:
      - Assentos
  /api/v1/layouts/{id}/sections:
    put:
      consumes:
      - application/json
      description: 'Substitui os setores e assentos de uma planta a partir de um formulário
        de fileiras: quantas fileiras, quantos assentos, onde ficam os corredores,
        qual a numeração. É o que descreve uma casa brasileira em uma requisição.
        Recusado quando a planta já está em uso por um evento.'
      parameters:
      - description: ID da planta
        in: path
        name: id
        required: true
        type: string
      - description: Setores
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/seating.GenerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/seating.LayoutDetailEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "409":
          description: A planta está em uso
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Gerar assentos da planta
      tags:
      - Assentos
  /api/v1/orders:
    get:
      description: Lista os pedidos do comprador autenticado, do mais recente para
        o mais antigo. Aceita filtro por status e por ingresso. O parâmetro status
        pode ser repetido para filtrar por vários ao mesmo tempo.
      parameters:
      - collectionFormat: multi
        description: Status do pedido; pode ser repetido
        in: query
        items:
          enum:
          - pending_payment
          - paid
          - expired
          - cancelled
          - failed
          - refunded
          - refund_required
          type: string
        name: status
        type: array
      - description: Filtrar por ingresso
        in: query
        name: ticketId
        type: string
      - description: Filtrar pelos pedidos de um evento
        in: query
        name: eventId
        type: string
      - description: Itens por página (padrão 20, máximo 100)
        in: query
        name: limit
        type: integer
      - description: Deslocamento da paginação
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/checkout.OrderListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar pedidos
      tags:
      - Compras
  /api/v1/orders/{id}:
    get:
      description: Retorna um pedido com o estado atual do pagamento. É este endpoint
        que o cliente consulta enquanto espera o código PIX aparecer.
      parameters:
      - description: ID do pedido
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/checkout.OrderEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar um pedido
      tags:
      - Compras
  /api/v1/orders/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Desiste de um pedido aguardando pagamento e devolve os ingressos
        ao estoque. Cancelar um pedido já cancelado devolve o mesmo pedido, sem erro.
      parameters:
      - description: ID do pedido
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/checkout.OrderEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancelar um pedido
      tags:
      - Compras
  /api/v1/orders/{id}/confirm:
    post:
      consumes:
      - application/json
      description: Registra nome, e-mail e documento do comprador, estende a reserva
        para a janela de pagamento e solicita a cobrança PIX. Reservar e confirmar
        são passos separados porque os ingressos saem do estoque assim que o comprador
        chega ao formulário, e não depois de preenchê-lo. Confirmar duas vezes atualiza
        os dados sem estender a reserva de novo nem criar uma segunda cobrança.
      parameters:
      - description: ID do pedido
        in: path
        name: id
        required: true
        type: string
      - description: Dados do comprador
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/checkout.ConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/checkout.OrderEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "409":
          description: A reserva expirou
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirmar os dados do comprador
      tags:
      - Compras
  /api/v1/orders/{id}/refund:
    post:
      description: Agenda o estorno de um pedido pago no provedor de pagamento e devolve
        os ingressos ao estoque. Restrito a administradores. O estorno é processado
        por um job durável e confirmado relendo a cobrança no provedor, então a resposta
        é 202 e o pedido deve ser consultado até ficar `refunded`. Pedir o estorno
        duas vezes estorna uma vez.
      parameters:
      - description: ID do pedido
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/checkout.OrderEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/checkout.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Estornar um pedido
      tags:
      - Compras
  /api/v1/orders/{id}/refund-eligibility:
    get:
      description: 'Responde se o comprador ainda pode cancelar e receber o reembolso,
        até quando, e quanto receberia de volta. Quando não pode, devolve o motivo:
        `window_closed` (passaram os 7 dias do arrependimento, CDC art. 49), `too_close_to_event`
        (faltam menos de 48h para o evento), `not_paid`, `already_refunded`, `event_passed`
        ou `request_open`. É a mesma função que o endpoint de solicitação usa para
        decidir, então a tela e a regra nunca divergem.'
      parameters:
      - description: ID do pedido
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/refund.EligibilityResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar se um pedido pode ser cancelado
      tags:
      - Reembolsos
  /api/v1/orders/{id}/refund-request:
    post:
      consumes:
      - application/json
      description: 'Abre um pedido de reembolso. Dentro do prazo legal de arrependimento
        (7 dias da compra e no mínimo 48h antes do evento) e em caso de evento cancelado,
        o pedido é APROVADO na hora e o estorno entra na fila: são hipóteses que o
        organizador não tem como recusar. Fora disso, o pedido fica pendente para
        o organizador decidir. O valor devolvido inclui a taxa de serviço, conforme
        entendimento do Procon-SP e do STJ. Pedir duas vezes devolve 409.'
      parameters:
      - description: ID do pedido
        in: path
        name: id
        required: true
        type: string
      - description: Motivo
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/refund.RequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/refund.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "403":
          description: O motivo informado não pode ser alegado por este usuário
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "409":
          description: Já existe um pedido de reembolso em andamento
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "422":
          description: Fora do prazo, ou pedido não reembolsável
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Solicitar reembolso de um pedido
      tags:
      - Reembolsos
  /api/v1/orders/{id}/tickets:
    get:
      description: 'Os ingressos de um pedido pago, com o código de cada um para apresentar
        na entrada. Restrito ao comprador do pedido e a administradores: o organizador
        do evento NÃO vê estes códigos, porque quem os tem pode entrar.'
      parameters:
      - description: ID do pedido
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admission.TicketListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Meus ingressos
      tags:
      - Entrada
  /api/v1/orders/{id}/tickets/{admissionId}/qr.png:
    get:
      description: 'O QR Code de um ingresso, em PNG, para ser exibido ou impresso.
        Endereçado pelo ID do ingresso e não pelo código: o endereço de uma imagem
        aparece no histórico do navegador e nos registros de qualquer proxy, e um
        ID sem sessão não serve para nada. Restrito ao comprador do pedido e a administradores.'
      parameters:
      - description: ID do pedido
        in: path
        name: id
        required: true
        type: string
      - description: ID do ingresso
        in: path
        name: admissionId
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admission.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Imagem do ingresso
      tags:
      - Entrada
  /api/v1/public/events:
    get:
      description: A vitrine pública. Aceita busca textual, categoria, cidade, intervalo
        de datas, preço máximo, apenas gratuitos, apenas com ingressos disponíveis,
        ordenação e paginação. Só retorna eventos publicados, independentemente do
        que o cliente enviar.
      parameters:
      - description: Busca por nome, local, cidade ou descrição
        in: query
        name: q
        type: string
      - description: Categoria
        in: query
        name: category
        type: string
      - description: Cidade
        in: query
        name: city
        type: string
      - description: Eventos a partir desta data (RFC3339)
        in: query
        name: from
        type: string
      - description: Eventos até esta data (RFC3339)
        in: query
        name: until
        type: string
      - description: Preço máximo em centavos do lote mais barato
        in: query
        name: maxPrice
        type: integer
      - description: Apenas eventos gratuitos
        in: query
        name: free
        type: boolean
      - description: Apenas eventos com ingressos disponíveis
        in: query
        name: available
        type: boolean
      - description: Ordenação
        enum:
        - relevance
        - starts_at
        - price
        - created_at
        in: query
        name: sort
        type: string
      - description: Itens por página (padrão 24, máximo 60)
        in: query
        name: limit
        type: integer
      - description: Deslocamento da paginação
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.ListEnvelope'
      summary: Listar eventos publicados
      tags:
      - Catálogo
  /api/v1/public/events/{id}/tiers:
    get:
      description: 'Os lotes que o evento vende, do mais barato ao mais caro. Só retorna
        lotes à venda de eventos publicados: é o que o painel de compra da página
        do evento monta.'
      parameters:
      - description: ID do evento
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.TierListEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/event.ErrorResponse'
      summary: Lotes de ingressos à venda
      tags:
      - Catálogo
  /api/v1/public/events/{slug}:
    get:
      description: 'A página pública do evento, resolvida pelo slug da URL. Um rascunho
        responde 404 e não 403: um 403 confirmaria que o evento existe naquele endereço.'
      parameters:
      - description: Slug do evento
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.EventEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/event.ErrorResponse'
      summary: Consultar um evento publicado
      tags:
      - Catálogo
  /api/v1/public/filters:
    get:
      description: As categorias com a contagem de eventos publicados em cada uma,
        e as cidades com mais eventos. É o que a página de listagem usa para montar
        os próprios filtros.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.FiltersEnvelope'
      summary: Opções de filtro
      tags:
      - Catálogo
  /api/v1/refund-requests:
    get:
      description: A caixa de entrada do organizador e o histórico do comprador. Sem
        `eventId`, lista os pedidos do próprio comprador; com `eventId`, lista os
        do evento, e exige ser o organizador dele. Pendentes primeiro.
      parameters:
      - description: Pedidos de reembolso de um evento (exige ser o organizador)
        in: query
        name: eventId
        type: string
      - description: Filtrar por situação
        enum:
        - pending
        - approved
        - rejected
        in: query
        name: status
        type: string
      - description: Somente os que ainda ocupam o pedido (pendentes e aprovados)
        in: query
        name: open
        type: boolean
      - description: Itens por página (padrão 20, máximo 100)
        in: query
        name: limit
        type: integer
      - description: Deslocamento da paginação
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/refund.ListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar pedidos de reembolso
      tags:
      - Reembolsos
  /api/v1/refund-requests/{id}:
    get:
      parameters:
      - description: ID do pedido de reembolso
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/refund.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar um pedido de reembolso
      tags:
      - Reembolsos
  /api/v1/refund-requests/{id}/approve:
    post:
      consumes:
      - application/json
      description: 'Autoriza o estorno e o coloca na fila durável, na mesma transação:
        uma aprovação sem estorno, ou um estorno sem aprovação registrada, são estados
        que não podem existir. Restrito ao organizador do evento e a administradores.
        Aprovar duas vezes devolve 409, porque a segunda é outra pessoa discordando
        da primeira.'
      parameters:
      - description: ID do pedido de reembolso
        in: path
        name: id
        required: true
        type: string
      - description: Observação da decisão
        in: body
        name: request
        schema:
          $ref: '#/definitions/refund.DecisionBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/refund.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "409":
          description: Já decidido
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Aprovar um pedido de reembolso
      tags:
      - Reembolsos
  /api/v1/refund-requests/{id}/reject:
    post:
      consumes:
      - application/json
      description: 'Recusa o pedido, com observação. A recusa é registrada e não altera
        o pedido de compra: é o caso sobre o qual o suporte será perguntado depois,
        então fica guardado. Restrito ao organizador do evento e a administradores.'
      parameters:
      - description: ID do pedido de reembolso
        in: path
        name: id
        required: true
        type: string
      - description: Observação da decisão
        in: body
        name: request
        schema:
          $ref: '#/definitions/refund.DecisionBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/refund.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
        "409":
          description: Já decidido
          schema:
            $ref: '#/definitions/refund.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Recusar um pedido de reembolso
      tags:
      - Reembolsos
  /api/v1/tickets:
    get:
      description: Lista os lotes de ingressos DO OPERADOR AUTENTICADO, incluindo
        rascunhos. Um administrador vê os de todos. Aceita filtro de status, busca
        por título ou descrição do lote, ordenação e paginação. O parâmetro `eventId`
        restringe a um evento; ele não amplia o escopo, que é sempre o do chamador.
      parameters:
      - description: Status do ingresso
        enum:
        - draft
        - on_sale
        - sold_out
        - cancelled
        in: query
        name: status
        type: string
      - description: Filtrar pelos lotes de um evento
        in: query
        name: eventId
        type: string
      - description: Busca por título ou descrição do lote
        in: query
        name: q
        type: string
      - description: Ordenação
        enum:
        - starts_at
        - created_at
        - price
        in: query
        name: sort
        type: string
      - description: Itens por página (padrão 20, máximo 100)
        in: query
        name: limit
        type: integer
      - description: Deslocamento da paginação
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ticket.TicketListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar ingressos
      tags:
      - Ingressos
    post:
      consumes:
      - application/json
      description: Cria um lote de ingressos para um evento. O preço é informado em
        centavos e o ingresso nasce como rascunho, invisível para o comprador, até
        ser colocado à venda.
      parameters:
      - description: Dados do ingresso
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ticket.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ticket.TicketEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar um ingresso
      tags:
      - Ingressos
  /api/v1/tickets/{id}:
    delete:
      description: 'Remove o lote de ingressos. A arte do evento não é afetada: ela
        pertence ao evento.'
      parameters:
      - description: ID do ingresso
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Removido
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Excluir um ingresso
      tags:
      - Ingressos
    get:
      description: Retorna um lote de ingressos pelo identificador. A arte do evento
        fica no evento, não no lote.
      parameters:
      - description: ID do ingresso
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ticket.TicketEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar um ingresso
      tags:
      - Ingressos
    put:
      consumes:
      - application/json
      description: Substitui os dados editáveis do ingresso. A quantidade não pode
        ficar abaixo do total já vendido e a quantidade vendida não é editável.
      parameters:
      - description: ID do ingresso
        in: path
        name: id
        required: true
        type: string
      - description: Dados do ingresso
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ticket.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ticket.TicketEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar um ingresso
      tags:
      - Ingressos
  /api/v1/tickets/{id}/status:
    patch:
      consumes:
      - application/json
      description: Move o ingresso entre rascunho, à venda, esgotado e cancelado.
        Colocar à venda exige estoque disponível.
      parameters:
      - description: ID do ingresso
        in: path
        name: id
        required: true
        type: string
      - description: Novo status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ticket.ChangeStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ticket.TicketEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/ticket.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Alterar o status de um ingresso
      tags:
      - Ingressos
  /api/v1/venues:
    get:
      description: Os locais do operador autenticado. Administradores veem todos.
      parameters:
      - description: Itens por página (padrão 20)
        in: query
        name: limit
        type: integer
      - description: Deslocamento da paginação
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/seating.VenueListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar locais
      tags:
      - Assentos
    post:
      consumes:
      - application/json
      description: Cria um local físico reutilizável. Um teatro desenha sua planta
        uma vez e vende duzentas noites a partir dela.
      parameters:
      - description: Dados do local
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/seating.VenueRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/seating.VenueEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar local
      tags:
      - Assentos
  /api/v1/venues/{id}/layouts:
    get:
      parameters:
      - description: ID do local
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/seating.LayoutListEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar plantas
      tags:
      - Assentos
    post:
      consumes:
      - application/json
      description: 'Cria uma planta do local. Um mesmo local pode ter mais de uma:
        a configuração padrão e a acústica, com o palco adiantado, têm assentos diferentes
        em lugares diferentes.'
      parameters:
      - description: ID do local
        in: path
        name: id
        required: true
        type: string
      - description: Dados da planta
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/seating.LayoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/seating.LayoutEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/seating.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar planta
      tags:
      - Assentos
  /auth/email/start:
    post:
      consumes:
      - application/json
      description: 'Envia um código de seis dígitos para o e-mail informado. A resposta
        é idêntica quer o e-mail já tenha conta ou não: de propósito, para que este
        endpoint não possa ser usado para descobrir quem tem conta. O código vale
        10 minutos, serve uma vez só e aceita no máximo 5 tentativas.'
      parameters:
      - description: E-mail
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.StartRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/auth.StartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "429":
          description: Código pedido cedo demais, ou vezes demais
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Pedir um código de acesso por e-mail
      tags:
      - Autenticação
  /auth/email/verify:
    post:
      consumes:
      - application/json
      description: 'Confere o código e abre uma sessão. Se o e-mail ainda não tinha
        conta, ela é criada agora: entrar e cadastrar são a mesma chamada, porque
        separá-las exigiria revelar antes se o e-mail já existe.'
      parameters:
      - description: Código
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "410":
          description: O código expirou ou já foi usado
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "429":
          description: Tentativas demais
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Entrar com o código recebido por e-mail
      tags:
      - Autenticação
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Autentica as credenciais e abre uma sessão. Envie X-Auth-Mode:
        cookie para receber cookies httpOnly em vez dos tokens no corpo.'
      parameters:
      - description: Credenciais
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Entrar com email e senha
      tags:
      - Autenticação
  /auth/logout:
    post:
      description: Revoga a sessão atual e remove os cookies de autenticação.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Encerrar a sessão atual
      tags:
      - Autenticação
  /auth/phone/start:
    post:
      consumes:
      - application/json
      description: 'Envia um código para o número informado. Responde 503 enquanto
        não houver provedor de SMS configurado: o código nunca é registrado em log
        nem devolvido na resposta. O restante do fluxo, limite de envios, limite de
        tentativas, expiração, é real.'
      parameters:
      - description: Celular
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.PhoneStartRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/auth.StartResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Pedir um código para confirmar o celular
      tags:
      - Autenticação
  /auth/phone/verify:
    post:
      consumes:
      - application/json
      description: Confere o código e marca o número como confirmado na conta.
      parameters:
      - description: Código
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirmar o celular com o código
      tags:
      - Autenticação
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotaciona o token de atualização de uso único e emite um novo token
        de acesso. O refresh token pode vir no corpo ou no cookie httpOnly refreshToken.
      parameters:
      - description: Token de atualização
        in: body
        name: request
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Renovar a sessão
      tags:
      - Autenticação
  /user/me:
    get:
      description: Retorna a identidade ligada à sessão autenticada.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar o usuário atual
      tags:
      - Autenticação
  /user/password:
    put:
      consumes:
      - application/json
      description: 'Adiciona uma senha à conta, como SEGUNDA forma de entrar: a primeira
        continua sendo o código por e-mail, e a conta funciona sem senha. Definir
        a primeira senha exige apenas a sessão; trocar uma senha existente exige a
        senha atual, porque uma sessão emprestada não deve bastar para trancar o dono
        fora da própria conta.'
      parameters:
      - description: Senha
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "422":
          description: Senha fraca, ou senha atual ausente
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Definir ou trocar a senha
      tags:
      - Autenticação
  /user/profile:
    get:
      description: 'Retorna o estado do cadastro obrigatório. O documento vem MASCARADO:
        o cliente só precisa saber se está preenchido e se parece o documento certo.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar os dados cadastrais
      tags:
      - Autenticação
    put:
      consumes:
      - application/json
      description: Grava documento, nome completo e data de nascimento. Exigidos por
        lei para vender ingresso no Brasil, meia-entrada é limitada por CPF e a cobrança
        PIX não é emitida sem documento. Todos os campos são armazenados criptografados.
      parameters:
      - description: Dados cadastrais
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: O documento já pertence a outra conta
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Salvar os dados cadastrais
      tags:
      - Autenticação
  /webhooks/asaas:
    post:
      consumes:
      - application/json
      description: 'Recebe as notificações de cobrança do Asaas. A requisição é autenticada
        pelo token compartilhado do cabeçalho asaas-access-token e o processamento
        é assíncrono: o endpoint apenas enfileira a releitura da cobrança e responde.
        O corpo da notificação NUNCA é usado como fonte de verdade: o Asaas envia
        a cobrança inteira, e mesmo assim o estado é sempre relido pela API, porque
        o token não assina o corpo.'
      parameters:
      - description: Token compartilhado configurado no painel do Asaas
        in: header
        name: asaas-access-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Notificação ignorada (não é de cobrança)
          schema:
            additionalProperties:
              type: string
            type: object
        "202":
          description: Notificação aceita para processamento
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Webhook do Asaas
      tags:
      - Webhooks
  /webhooks/mercadopago:
    post:
      consumes:
      - application/json
      description: 'Recebe as notificações de pagamento do Mercado Pago. A requisição
        é autenticada pela assinatura HMAC do cabeçalho x-signature e o processamento
        acontece de forma assíncrona: o endpoint apenas enfileira a leitura do pagamento
        e responde. O corpo da notificação nunca é usado como fonte de verdade; o
        estado é sempre relido do provedor.'
      parameters:
      - description: Assinatura HMAC enviada pelo Mercado Pago
        in: header
        name: x-signature
        required: true
        type: string
      - description: Identificador da entrega
        in: header
        name: x-request-id
        type: string
      - description: ID do pagamento (formato moderno)
        in: query
        name: data.id
        type: string
      - description: Tópico da notificação (formato IPN legado)
        in: query
        name: topic
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Notificação ignorada (não é de pagamento)
          schema:
            additionalProperties:
              type: string
            type: object
        "202":
          description: Notificação aceita para processamento
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Webhook do Mercado Pago
      tags:
      - Webhooks
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Use o formato: Bearer {token}. Navegadores também podem autenticar
      por cookies httpOnly.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
