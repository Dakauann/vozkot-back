basePath: /
definitions:
  admission.DoorEnvelope:
    properties:
      data:
        $ref: '#/definitions/admission.DoorResponse'
    type: object
  admission.DoorResponse:
    properties:
      admittedCount:
        example: 682
        type: integer
      remaining:
        example: 318
        type: integer
    type: object
  admission.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  admission.ScanEnvelope:
    properties:
      data:
        $ref: '#/definitions/admission.ScanResponse'
    type: object
  admission.ScanRequest:
    properties:
      code:
        description: |-
          Code is whatever the scanner or the keyboard produced. It is normalised
          and check-verified by the domain, so the grouped form, lower case and
          the usual O-for-zero substitutions are all accepted.
        example: 7QP5-2NFX-W78H
        type: string
    type: object
  admission.ScanResponse:
    properties:
      admitted:
        description: Admitted is the one boolean the screen needs to pick green or
          red.
        example: true
        type: boolean
      admittedAt:
        description: |-
          AdmittedAt is when the code was FIRST used, which is what the holder is
          told when it is refused as already used.
        example: "2026-09-16T21:14:03Z"
        type: string
      admittedCount:
        example: 682
        type: integer
      orderReference:
        example: A1B2C3D4
        type: string
      outcome:
        description: |-
          Outcome is the machine-readable verdict the client branches on:
          admitted, already_admitted, void, wrong_event, not_paid, unknown,
          malformed.
        enum:
        - admitted
        - already_admitted
        - void
        - wrong_event
        - not_paid
        - unknown
        - malformed
        example: admitted
        type: string
      remaining:
        description: |-
          Remaining and Admitted counters keep the door's screen live without a
          second request.
        example: 318
        type: integer
      seat:
        allOf:
        - $ref: '#/definitions/admission.SeatResponse'
        description: |-
          Seat is the reserved chair, absent for general admission.

          The most useful thing the door gains from reserved seating: somebody has
          just been told they may come in, and the next thing they ask is where to
          sit. Sent pre-formatted as well as in parts, so the screen and the email
          cannot disagree about how a chair is named.
      sequence:
        description: Sequence and Total read as "2 de 3" on a group's tickets.
        example: 2
        type: integer
      ticketTitle:
        example: Pista
        type: string
    type: object
  admission.SeatResponse:
    properties:
      label:
        description: |-
          Label is the whole thing, formatted once on the server.

          The door, the wallet, the receipt and the confirmation email all have to
          say the same thing about a chair somebody is standing in front of, and
          four copies of that format string is four chances to disagree.
        example: Plateia A · Fila K · Assento 12
        type: string
      row:
        example: K
        type: string
      seat:
        example: "12"
        type: string
      section:
        example: Plateia A
        type: string
    type: object
  admission.TicketListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/admission.TicketResponse'
        type: array
    type: object
  admission.TicketResponse:
    properties:
      admittedAt:
        type: string
      code:
        description: |-
          Code is the printed, grouped form, and QRPayload is what a QR must
          encode. Both are sent because the page draws both, and the client must
          not have to know that one is the other with the hyphens removed.
        example: 7QP5-2NFX-W78H
        type: string
      id:
        example: adm_9f2c1d8a
        type: string
      qrPayload:
        example: 7QP52NFXW78H
        type: string
      seat:
        $ref: '#/definitions/admission.SeatResponse'
      sequence:
        example: 2
        type: integer
      status:
        enum:
        - issued
        - admitted
        - void
        example: issued
        type: string
      ticketTitle:
        example: Pista
        type: string
    type: object
  auth.AuthResponse:
    properties:
      accessToken:
        example: eyJhbGciOi...
        type: string
      refreshToken:
        example: token_de_atualizacao
        type: string
      tokenType:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.ErrorResponse:
    properties:
      error:
        example: credenciais inválidas
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: agente@empresa.com.br
        type: string
      password:
        example: SenhaForte1
        type: string
    type: object
  auth.MessageResponse:
    properties:
      message:
        example: Sessão encerrada com sucesso
        type: string
    type: object
  auth.PhoneStartRequest:
    properties:
      phone:
        example: (84) 99440-9624
        type: string
    type: object
  auth.ProfileRequest:
    properties:
      birthDate:
        example: "1994-03-21"
        type: string
      city:
        example: Natal
        type: string
      document:
        example: 529.982.247-25
        type: string
      documentType:
        enum:
        - cpf
        - cnpj
        - passport
        example: cpf
        type: string
      gender:
        description: |-
          Gender, City and UF are OPTIONAL and always will be. They exist so an
          organiser can see who bought tickets to their event; a buyer who does not
          want to answer must still be able to buy one, so an empty value is
          accepted and stored as "não informado" rather than refused.
        enum:
        - female
        - male
        - non_binary
        - other
        - undisclosed
        example: female
        type: string
      legalName:
        example: Maria Souza
        type: string
      uf:
        example: RN
        type: string
    type: object
  auth.ProfileResponse:
    properties:
      birthDate:
        example: "1994-03-21"
        type: string
      city:
        example: Natal
        type: string
      complete:
        example: true
        type: boolean
      documentMask:
        example: 529.***.***-25
        type: string
      documentType:
        example: cpf
        type: string
      gender:
        description: |-
          The optional demographics come back in full, unlike the document: they
          identify nobody, and the form has to be able to show the buyer what it
          already has so they are not asked the same question twice.
        example: female
        type: string
      legalName:
        example: Maria Souza
        type: string
      phoneMask:
        example: (84) *****-9624
        type: string
      phoneVerified:
        example: false
        type: boolean
      uf:
        example: RN
        type: string
    type: object
  auth.RefreshTokenRequest:
    properties:
      refreshToken:
        example: token_de_atualizacao
        type: string
    type: object
  auth.SetPasswordRequest:
    properties:
      current:
        description: Current is required only when the account already has a password.
        type: string
      new:
        example: UmaSenhaForte1
        type: string
    type: object
  auth.StartRequest:
    properties:
      email:
        example: maria@exemplo.com.br
        type: string
    type: object
  auth.StartResponse:
    properties:
      challengeId:
        example: vch_9f2c1d8a
        type: string
      expiresAt:
        type: string
      resendAt:
        description: |-
          ResendAt is when another code may be requested, so the screen can show a
          real countdown instead of guessing at the server's rule.
        type: string
    type: object
  auth.UserResponse:
    properties:
      email:
        example: maria@empresa.com.br
        type: string
      id:
        example: usr_a1b2c3
        type: string
      name:
        example: Maria Silva
        type: string
      role:
        example: user
        type: string
    type: object
  auth.VerifyRequest:
    properties:
      challengeId:
        example: vch_9f2c1d8a
        type: string
      code:
        example: "481905"
        type: string
    type: object
  checkout.Buyer:
    properties:
      document:
        description: Document is the CPF or CNPJ. PIX in Brazil cannot be issued without
          one.
        example: "12345678909"
        type: string
      email:
        description: Email receives the ingresso, and identifies the payer to the
          provider.
        example: maria@exemplo.com.br
        type: string
      name:
        example: Maria Souza
        type: string
    type: object
  checkout.CheckoutItem:
    properties:
      quantity:
        example: 2
        type: integer
      seatIds:
        description: |-
          SeatIDs names the reserved chairs this line buys, for a seated event.

          Its presence is what makes the line seated. Omit it and the line is
          counted stock, which is every line of a general-admission event and the
          common case. Send it and Quantity is derived from it: a mismatch is
          refused rather than resolved, since either number could be the one the
          buyer meant.
        items:
          type: string
        type: array
      ticketId:
        example: tkt_a1b2c3d4
        type: string
    type: object
  checkout.CheckoutRequest:
    properties:
      buyer:
        allOf:
        - $ref: '#/definitions/checkout.Buyer'
        description: |-
          Buyer is optional here. The browser reserves first and supplies the buyer
          at /confirm, so that the tickets come off the shelf while the form is
          being filled in rather than after it. Supplying it here does both at
          once.
      confirm:
        description: |-
          Confirm asks for the charge immediately, instead of waiting for the
          confirm step. It requires Buyer to be complete.
        example: false
        type: boolean
      items:
        description: Items is the basket. Every tier must belong to the same event.
        items:
          $ref: '#/definitions/checkout.CheckoutItem'
        type: array
      method:
        description: |-
          Method is optional and defaults to PIX, the only instrument this
          integration can issue from a server.
        enum:
        - pix
        example: pix
        type: string
      quantity:
        example: 2
        type: integer
      seatIds:
        description: SeatIDs is the single-tier shorthand's seats, for a reserved
          event.
        items:
          type: string
        type: array
      ticketId:
        description: |-
          TicketID and Quantity are the single-tier shorthand, kept because an
          operator selling one tier at the door, and the load harness, have no
          use for a list of one. Ignored when Items is present.
        example: tkt_a1b2c3d4
        type: string
    type: object
  checkout.ConfirmRequest:
    properties:
      buyer:
        $ref: '#/definitions/checkout.Buyer'
      method:
        enum:
        - pix
        example: pix
        type: string
    type: object
  checkout.ErrorResponse:
    properties:
      code:
        example: insufficient_stock
        type: string
      error:
        example: not enough tickets available
        type: string
    type: object
  checkout.OrderEnvelope:
    properties:
      data:
        $ref: '#/definitions/checkout.OrderResponse'
    type: object
  checkout.OrderEventResponse:
    properties:
      city:
        example: Salvador
        type: string
      coverUrl:
        type: string
      id:
        example: evt_7c1a
        type: string
      name:
        example: Festival de Verão 2026
        type: string
      slug:
        example: festival-de-verao-2026
        type: string
      startsAt:
        type: string
      uf:
        example: BA
        type: string
      venue:
        example: Arena Fonte Nova
        type: string
    type: object
  checkout.OrderItemResponse:
    properties:
      feeCents:
        example: 4800
        type: integer
      quantity:
        example: 2
        type: integer
      ticketId:
        example: tkt_a1b2c3d4
        type: string
      ticketTitle:
        example: Pista
        type: string
      totalCents:
        example: 48000
        type: integer
      unitFeeCents:
        example: 2400
        type: integer
      unitPriceCents:
        description: |-
          UnitPriceCents and TotalCents are the FACE value: what the organiser
          charges for one ticket, and for this line. The fee fields are the service
          charge on top, so what the buyer paid for this line is totalCents +
          feeCents.
        example: 24000
        type: integer
    type: object
  checkout.OrderListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/checkout.OrderResponse'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 12
        type: integer
    type: object
  checkout.OrderResponse:
    properties:
      buyerEmail:
        example: maria@exemplo.com.br
        type: string
      buyerName:
        example: Maria Souza
        type: string
      confirmed:
        description: |-
          Confirmed reports whether the buyer has supplied their details. An
          unconfirmed order is a basket on the short cart hold and has no charge.
        example: false
        type: boolean
      createdAt:
        type: string
      currency:
        example: BRL
        type: string
      event:
        allOf:
        - $ref: '#/definitions/checkout.OrderEventResponse'
        description: Event is the night, resolved for listings. Omitted when unavailable.
      eventId:
        example: evt_7c1a
        type: string
      holdExpiresAt:
        description: |-
          HoldExpiresAt is when the reserved tickets go back on sale. It is the
          clock a checkout screen counts down.
        type: string
      id:
        example: ord_9f2c1d8a
        type: string
      items:
        description: Items is every tier on the order, never empty.
        items:
          $ref: '#/definitions/checkout.OrderItemResponse'
        type: array
      paidAt:
        type: string
      payment:
        $ref: '#/definitions/checkout.PaymentResponse'
      quantity:
        description: |-
          Quantity is the total across every line, so a client that only wants the
          headline number does not have to add them up.
        example: 3
        type: integer
      refund:
        allOf:
        - $ref: '#/definitions/checkout.RefundStateResponse'
        description: |-
          Refund is the cancellation state of this order: whether the buyer may
          still ask for their money back, until when, and the request already in
          flight if there is one.

          Attached to a LISTING as well as to a single order, resolved in one query
          for the whole page, so an order history can draw its buttons without
          asking per row.
      serviceFeeCents:
        example: 4800
        type: integer
      status:
        enum:
        - pending_payment
        - paid
        - expired
        - cancelled
        - failed
        - refunded
        - refund_required
        example: pending_payment
        type: string
      subtotalCents:
        description: |-
          SubtotalCents is the tickets, ServiceFeeCents is the charge on top, and
          TotalCents is what the buyer pays — always the sum of the two.

          All three are sent rather than just the total, because a checkout screen
          that shows a number larger than the prices the buyer just chose, with no
          line explaining the difference, is the single largest cause of abandoned
          carts. The client cannot derive the split from a rate: the rate is not
          sent, deliberately, because an old order was charged an old one.
        example: 48000
        type: integer
      totalCents:
        example: 52800
        type: integer
      updatedAt:
        type: string
    type: object
  checkout.PaymentResponse:
    properties:
      id:
        example: "1234567890"
        type: string
      method:
        example: pix
        type: string
      pixCopyPaste:
        description: PixCopyPaste is the EMV string a bank app reads.
        type: string
      pixQrCodeBase64:
        description: PixQRCodeBase64 is the same payload as a PNG, ready for an <img>
          tag.
        type: string
      provider:
        description: |-
          Provider is empty until a charge exists: an order that has not been
          charged has not been through one.
        example: asaas
        type: string
      status:
        enum:
        - pending
        - paid
        - rejected
        - cancelled
        - refunded
        - charged_back
        - in_analysis
        example: pending
        type: string
    type: object
  checkout.RefundStateResponse:
    properties:
      refusal:
        description: |-
          Refusal names why not: window_closed, too_close_to_event, not_paid,
          already_refunded, event_passed, request_open.
        example: window_closed
        type: string
      requestId:
        description: RequestID is the request already open on this order, if any.
        example: rfr_9f2c1d8a
        type: string
      requestable:
        description: Requestable is whether the buyer may open a request RIGHT NOW.
        example: true
        type: boolean
      status:
        description: |-
          Status is the in-flight request's state — pending, approved or rejected —
          absent when there is no request.
        example: pending
        type: string
      until:
        description: |-
          Until is the deadline for the right of withdrawal, so the order page can
          say "você pode cancelar até 12/07" instead of "soon".
        type: string
    type: object
  event.CategoryResponse:
    properties:
      count:
        description: |-
          Count lets the UI grey out an empty category instead of hiding it. A
          filter row whose options come and go is one a buyer cannot learn.
        type: integer
      value:
        example: festas_shows
        type: string
    type: object
  event.CityResponse:
    properties:
      city:
        type: string
      count:
        type: integer
      uf:
        type: string
    type: object
  event.CreateRequest:
    properties:
      category:
        example: festas_shows
        type: string
      description:
        type: string
      endsAt:
        type: string
      location:
        $ref: '#/definitions/event.LocationRequest'
      name:
        example: Festival Aurora
        type: string
      salesMode:
        description: |-
          SalesMode is how this event sells: `counted` by the number, the way a
          party does, or `seated` by the chair, with a row and a seat number. It is
          a declaration and not a fact about inventory — the seats themselves
          answer whether a night has any — but nothing else can be derived from an
          event that has no tiers yet, and the interface has to know which question
          to ask next. Empty means counted.
        enum:
        - counted
        - seated
        example: counted
        type: string
      startsAt:
        example: "2026-11-15T22:00:00-03:00"
        type: string
      status:
        enum:
        - draft
        - published
        - cancelled
        example: draft
        type: string
    type: object
  event.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  event.EventEnvelope:
    properties:
      data:
        $ref: '#/definitions/event.EventResponse'
    type: object
  event.EventResponse:
    properties:
      category:
        type: string
      createdAt:
        type: string
      description:
        type: string
      endsAt:
        type: string
      id:
        example: evt_a1b2c3d4
        type: string
      location:
        $ref: '#/definitions/event.LocationResponse'
      media:
        items:
          $ref: '#/definitions/event.MediaResponse'
        type: array
      name:
        type: string
      salesMode:
        enum:
        - counted
        - seated
        type: string
      slug:
        example: festival-aurora
        type: string
      startsAt:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  event.FiltersEnvelope:
    properties:
      data:
        $ref: '#/definitions/event.FiltersResponse'
    type: object
  event.FiltersResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/event.CategoryResponse'
        type: array
      cities:
        items:
          $ref: '#/definitions/event.CityResponse'
        type: array
    type: object
  event.ListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/event.ListingResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  event.ListingResponse:
    properties:
      availableTickets:
        type: integer
      category:
        type: string
      createdAt:
        type: string
      description:
        type: string
      endsAt:
        type: string
      fromPriceCents:
        description: |-
          FromPriceCents is the cheapest tier still on sale. Null renders as
          "Esgotado" rather than as "free".
        type: integer
      id:
        example: evt_a1b2c3d4
        type: string
      location:
        $ref: '#/definitions/event.LocationResponse'
      media:
        items:
          $ref: '#/definitions/event.MediaResponse'
        type: array
      name:
        type: string
      salesMode:
        enum:
        - counted
        - seated
        type: string
      slug:
        example: festival-aurora
        type: string
      startsAt:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  event.LocationRequest:
    properties:
      address:
        example: Av. Alberto Craveiro, 2901
        type: string
      city:
        example: Fortaleza
        type: string
      latitude:
        description: |-
          Latitude and Longitude are optional and travel together. Supplying them
          means "a person placed this pin", and the server will not overwrite them
          with whatever a geocoder thinks.
        example: -3.807
        type: number
      longitude:
        example: -38.522
        type: number
      neighborhood:
        example: Castelão
        type: string
      postalCode:
        example: 60861-630
        type: string
      uf:
        example: CE
        type: string
      venue:
        example: Arena Castelão
        type: string
    type: object
  event.LocationResponse:
    properties:
      address:
        type: string
      city:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      mapsUrl:
        description: |-
          MapsURL and WazeURL are built server-side so every client opens the same
          place, and so a client never has to know the URL shape of a map provider.
          Empty when the event has no coordinates.
        type: string
      neighborhood:
        type: string
      postalCode:
        type: string
      uf:
        type: string
      venue:
        type: string
      wazeUrl:
        type: string
    type: object
  event.MediaResponse:
    properties:
      blurDataUrl:
        type: string
      contentType:
        type: string
      height:
        type: integer
      id:
        type: string
      kind:
        enum:
        - image
        - video
        type: string
      position:
        type: integer
      sizeBytes:
        type: integer
      url:
        type: string
      width:
        description: |-
          Width, Height and BlurDataURL are what a client needs to reserve the
          right box and paint something before the bytes arrive. Zero and empty
          when the asset predates the pipeline that generates them.
        type: integer
    type: object
  event.PinRequest:
    properties:
      latitude:
        example: -3.807
        type: number
      longitude:
        example: -38.522
        type: number
    type: object
  event.TierListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/event.TierResponse'
        type: array
    type: object
  event.TierResponse:
    properties:
      available:
        type: integer
      currency:
        type: string
      description:
        type: string
      eventId:
        type: string
      feeCents:
        type: integer
      id:
        type: string
      priceCents:
        description: |-
          Centavos. No float ever touches a price.

          PriceCents is the FACE value the organiser set. FeeCents is the service
          charge added on top of one ticket, and TotalCents is what the buyer will
          actually pay for it — the number that has to appear on the event page,
          because a total that first shows up at the last step of checkout is the
          single largest cause of an abandoned cart.
        type: integer
      quantity:
        type: integer
      sold:
        type: integer
      status:
        type: string
      title:
        type: string
      totalCents:
        type: integer
    type: object
  event.UpdateRequest:
    properties:
      category:
        example: festas_shows
        type: string
      description:
        type: string
      endsAt:
        type: string
      location:
        $ref: '#/definitions/event.LocationRequest'
      name:
        example: Festival Aurora
        type: string
      salesMode:
        description: |-
          SalesMode is how this event sells: `counted` by the number, the way a
          party does, or `seated` by the chair, with a row and a seat number. It is
          a declaration and not a fact about inventory — the seats themselves
          answer whether a night has any — but nothing else can be derived from an
          event that has no tiers yet, and the interface has to know which question
          to ask next. Empty means counted.
        enum:
        - counted
        - seated
        example: counted
        type: string
      startsAt:
        example: "2026-11-15T22:00:00-03:00"
        type: string
      status:
        enum:
        - draft
        - published
        - cancelled
        example: draft
        type: string
    type: object
  refund.DecisionBody:
    properties:
      note:
        example: Reembolso autorizado
        type: string
    type: object
  refund.EligibilityResponse:
    properties:
      allowed:
        example: true
        type: boolean
      amountCents:
        description: |-
          AmountCents is what would come back to the BUYER and FeeCents how much of
          it is our commission. Both are pointers and both are OMITTED for an
          organiser: see SeesPlatformShare in usecases/refund.

          Omitted rather than zeroed. A zero here would render as "R$ 0,00 comes
          back", which is worse than saying nothing.
        example: 11000
        type: integer
      feeCents:
        example: 1000
        type: integer
      organiserCents:
        description: |-
          OrganiserCents is the part of the refund that comes out of the
          organiser's revenue. Always sent, to everyone.
        example: 10000
        type: integer
      refundsFees:
        description: |-
          RefundsFees says the fee is included. Rendered beside the amount because
          "R$ 110,00, taxa incluída" is the sentence that prevents the dispute.
        example: true
        type: boolean
      refusal:
        description: |-
          Refusal is the stable name of the reason, for a client to branch on:
          window_closed, too_close_to_event, not_paid, already_refunded,
          event_passed, request_open.
        example: too_close_to_event
        type: string
      request:
        allOf:
        - $ref: '#/definitions/refund.Response'
        description: Request is the one already in flight, when there is one.
      until:
        description: |-
          Until is when the right to cancel expires, so the page can render a real
          date instead of "soon". Absent for grounds that have no deadline.
        type: string
    type: object
